<svg
    width="738"
    height="738"
    viewBox="0 0 646.34 660.54"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
    >
    <g filter="url(#glow)">
        <ellipse
        cx="323.17"
        cy="330.27"
        rx="323.17"
        ry="330.27"
        fill="#3700FF"
        />
    </g>

    <defs>
        <filter
        id="glow"
        x="-600"
        y="-600"
        width="1846.34"
        height="1860.54"
        filterUnits="userSpaceOnUse"
        color-interpolation-filters="sRGB"
        >
        <feFlood flood-opacity="0" result="BackgroundImageFix" />
        <feBlend
            mode="normal"
            in="SourceGraphic"
            in2="BackgroundImageFix"
            result="shape"
        />
        <feGaussianBlur stdDeviation="300" result="blur" />
        </filter>
    </defs>
</svg>